name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          D=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          echo "Found app in: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: ${{ steps.find.outputs.dir }}
      - run: npx cap sync android
        working-directory: ${{ steps.find.outputs.dir }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ steps.find.outputs.dir }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: impacct-preview-apk
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
